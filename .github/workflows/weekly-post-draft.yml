name: Weekly Fintech Blog Draft

on:
  schedule:
    # 매주 수요일 00:00 UTC = 매주 수요일 09:00 KST
    - cron: "0 0 * * 3"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          # Pro/Max 구독이 있으면 로컬에서 `claude setup-token` 실행 후
          # 그 값을 CLAUDE_CODE_OAUTH_TOKEN 시크릿으로 등록 (API 별도 과금 없음).
          # 구독이 없으면 이 줄 대신 anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }} 사용.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}

            너는 이 저장소가 담고 있는 "결제·핀테크 엔지니어링 브리핑" 블로그의 주간 포스트
            초안을 만들고 리뷰용 PR을 여는 작업을 수행한다.

            먼저 `.claude/skills/weekly-blog-draft/SKILL.md`를 읽어라. 블로그 컨셉, 콘텐츠
            트랙(A: 규제·정책 / B: 인프라·시스템), 리서치 기준, 작성 구조, frontmatter 규격,
            날짜 지정 규칙, 발행 규칙이 모두 그 문서에 있다. 이 프롬프트는 그 문서를 실행하기
            위한 래퍼일 뿐이므로, 내용이 서로 다르면 SKILL.md를 최신으로 간주한다.

            ## 완료 후 — 절대 main에 직접 커밋/푸시하지 않는다
            1. 새 브랜치 생성: `git checkout -b weekly-draft/<오늘날짜>`
            2. 새로 만든 포스트 파일을 `git add`, 커밋 (커밋 메시지: `post: <글 제목>`)
            3. 이번 실행에서 SKILL.md의 판단 기준으로 명확히 설명 안 되는 상황을 겪었거나(실수,
               모호한 판단, 새로 찾은 신뢰 출처 등) 더 나은 규칙을 찾았다면, SKILL.md의 "운영
               중 발견한 이슈"와 관련 규칙 섹션을 갱신하고 같은 커밋에 포함한다 — 이 문서가
               스스로 진화해야 다음 실행이 더 나아진다.
            4. `git push -u origin weekly-draft/<오늘날짜>`
            5. `gh pr create --base main --title "주간 초안: <글 제목>" --body "<이번 글 2~3문장
               요약과 참고자료 링크 목록. SKILL.md를 갱신했다면 무엇을 왜 바꿨는지도 적는다>"`
            6. PR을 연 뒤 별도 작업(머지, main 조작 등)은 하지 않는다. 사람이 검토 후 직접
               머지한다.

          claude_args: |
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,Bash(git:*),Bash(gh pr create:*)"
        env:
          GH_TOKEN: ${{ github.token }}
