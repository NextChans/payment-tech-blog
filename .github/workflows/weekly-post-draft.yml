name: Weekly Fintech Blog Draft

on:
  schedule:
    # 매주 수요일 00:00 UTC = 매주 수요일 09:00 KST
    - cron: "0 0 * * 3"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          # Pro/Max 구독이 있으면 로컬에서 `claude setup-token` 실행 후
          # 그 값을 CLAUDE_CODE_OAUTH_TOKEN 시크릿으로 등록 (API 별도 과금 없음).
          # 구독이 없으면 이 줄 대신 anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }} 사용.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}

            너는 이 저장소가 담고 있는 "결제·핀테크 엔지니어링 브리핑" 블로그의 주간 포스트
            초안을 만들고 리뷰용 PR을 여는 작업을 수행한다. 이 블로그는 두 개의 콘텐츠 트랙을
            운영한다 — (트랙 A) PG/간편결제/전자금융 규제와 업계 동향, (트랙 B) AWS 인프라,
            전자금융업자의 클라우드 이용 신고 등 컴플라이언스, PG/선불 사업에 필요한 시스템
            구성, 결제 도메인에서 쓸 만한 오픈소스·상용 툴 비교. 모두 백엔드 아키텍처 관점에서
            분석하며, 매주 구체적 근거(그 주 실제 뉴스/공시, 또는 실제 AWS 서비스명·오픈소스
            프로젝트명·버전 등)를 갖춘 심층 분석 글을 발행한다. 일반적인 "AI 양산형" 콘텐츠와
            다르게, 반드시 검증 가능한 구체적 근거를 갖춰 써야 한다. 블로그 운영자의 소속·직함
            등 개인 신상 정보는 절대 글 내용에 포함하지 않는다.

            ## 사전 준비
            1. `content/posts/`의 기존 파일명·내용을 확인해 이미 다룬 주제를 파악한다 (중복 방지).
            2. `README.md`의 "콘텐츠 캘린더", "SEO 키워드 전략" 섹션을 읽는다.

            ## 트랙 선택 및 리서치
            먼저 트랙 A(규제·정책)를 시도한다: WebSearch로 최근 1~2주 내 한국 PG/간편결제/
            전자금융/핀테크 규제·업계 뉴스를 검색한다. 금융위원회, 법제처, 전자신문, 머니투데이,
            법률신문(로펌 뉴스레터) 등 신뢰할 수 있는 출처를 우선한다. 시행일이 임박한 규제 등
            구체적이고 시의성 있는 소재를 찾으면 그것으로 진행한다.

            트랙 A에 마땅한 소재가 없으면(이미 다룬 주제뿐이거나 새 뉴스가 없으면) 트랙 B(인프라·
            시스템 구성)로 넘어간다: README 콘텐츠 캘린더의 트랙 B 후보 중 아직 안 다룬 것을
            고르고, AWS 공식 문서·re:Invent 발표, 금융위/금감원의 클라우드 이용 신고 관련 규정,
            해당 오픈소스 프로젝트의 공식 저장소/릴리스 노트 등 1차 출처로 근거를 보강한다. 트랙
            B는 일반론이 아니라 실제 서비스명·설정값·버전·트레이드오프까지 구체적으로 검증한다.

            ## 작성
            `content/posts/2026-09-01-pg-settlement-fund-segregation.md`의 구조와 톤을 그대로
            따라 새 글을 쓴다. 트랙 A: 배경 / 핵심 변경 내용 / 백엔드 관점 실무 조언(원장 설계,
            배치 정합성, 감사로그, 장애 대응 등) / 체크리스트 / "참고자료"(이번에 검색으로 찾은
            실제 출처 링크). 트랙 B: 배경(왜 이 구성/툴이 필요한지) / 아키텍처 옵션 비교와
            트레이드오프 / 체크리스트 / "참고자료"(공식 문서·저장소 링크).

            분량은 1,200~2,000자 이상, 시니어 개발자 대상이므로 기초 설명은 생략하고 실무적
            판단·트레이드오프 위주로 쓴다. 한국어로 작성. 특정 회사·소속을 암시하는 표현은 쓰지
            않는다. frontmatter(title/description/date/tags/keywords)는 기존 글과 동일한
            형식을 따르고, keywords는 README의 SEO 롱테일 키워드 전략을 참고한다. 파일명은
            `content/posts/YYYY-MM-DD-slug.md` (오늘 날짜).

            ## 완료 후 — 절대 main에 직접 커밋/푸시하지 않는다
            1. 새 브랜치 생성: `git checkout -b weekly-draft/<오늘날짜>`
            2. 새로 만든 포스트 파일만 `git add`, 커밋 (커밋 메시지: `post: <글 제목>`)
            3. `git push -u origin weekly-draft/<오늘날짜>`
            4. `gh pr create --base main --title "주간 초안: <글 제목>" --body "<이번 글 2~3문장
               요약과 참고자료 링크 목록>"`
            5. PR을 연 뒤 별도 작업(머지, main 조작 등)은 하지 않는다. 사람이 검토 후 직접
               머지한다.

          claude_args: |
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,Bash(git:*),Bash(gh pr create:*)"
        env:
          GH_TOKEN: ${{ github.token }}
