<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" role="img" aria-label="정산 서비스가 PG업인지, 대규모유통업법 적용 대상인지, 규제 해당이 없는지 판단하는 흐름도">
  <rect x="0" y="0" width="860" height="480" fill="#0b0f14" />

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b98a5" />
    </marker>
  </defs>

  <g font-family="sans-serif" fill="#e6edf3">
    <!-- Q1 -->
    <rect x="30" y="20" width="460" height="66" rx="12" fill="#161d26" stroke="#1f2933" />
    <text x="50" y="46" font-size="13" font-weight="600">① 대가를 수수하고 '정산'을 대행하는 서비스인가?</text>
    <text x="50" y="66" font-size="11" fill="#8b98a5">(개정 전자금융거래법 제2조제19호)</text>

    <!-- T1 -->
    <rect x="560" y="20" width="270" height="66" rx="12" fill="#10161d" stroke="#8b98a5" stroke-dasharray="4 3" />
    <text x="580" y="46" font-size="12" font-weight="600" fill="#8b98a5">아니오</text>
    <text x="580" y="66" font-size="12" fill="#8b98a5">정산 관련 규제 해당 없음</text>

    <line x1="490" y1="53" x2="555" y2="53" stroke="#8b98a5" stroke-width="1.5" marker-end="url(#arrow)" />

    <line x1="260" y1="86" x2="260" y2="120" stroke="#8b98a5" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="272" y="108" font-size="11" fill="#4f9dff">예</text>

    <!-- Q2 -->
    <rect x="30" y="130" width="460" height="70" rx="12" fill="#161d26" stroke="#1f2933" />
    <text x="50" y="156" font-size="13" font-weight="600">② 제3자 간 거래의 정산을 대행하는가,</text>
    <text x="50" y="174" font-size="13" font-weight="600">자기 사업의 일부인 '내부정산'인가?</text>
    <text x="50" y="192" font-size="11" fill="#8b98a5">(제3조제1항, '부수적 정산대행' 제외 조항)</text>

    <!-- T2 -->
    <rect x="560" y="130" width="270" height="70" rx="12" fill="#10161d" stroke="#4f9dff" stroke-width="2" />
    <text x="580" y="152" font-size="12" font-weight="600" fill="#4f9dff">제3자 간 거래 대행</text>
    <text x="580" y="170" font-size="12">PG업 해당</text>
    <text x="580" y="186" font-size="11" fill="#8b98a5">전자금융거래법 적용(등록·외부관리 등)</text>

    <line x1="490" y1="165" x2="555" y2="165" stroke="#4f9dff" stroke-width="1.5" marker-end="url(#arrow)" />

    <line x1="260" y1="200" x2="260" y2="234" stroke="#8b98a5" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="272" y="222" font-size="11" fill="#8b98a5">내부정산</text>

    <!-- Q3 -->
    <rect x="30" y="244" width="460" height="70" rx="12" fill="#161d26" stroke="#1f2933" />
    <text x="50" y="270" font-size="13" font-weight="600">③ 온라인 중개거래(오픈마켓) 형태로</text>
    <text x="50" y="288" font-size="13" font-weight="600">입점 판매자와 거래하는가?</text>
    <text x="50" y="306" font-size="11" fill="#8b98a5">(대규모유통업법 적용 여부 판단)</text>

    <!-- T3 -->
    <rect x="560" y="244" width="270" height="70" rx="12" fill="#10161d" stroke="#4f9dff" stroke-width="2" />
    <text x="580" y="266" font-size="12" font-weight="600" fill="#4f9dff">예</text>
    <text x="580" y="284" font-size="12">대규모유통업법 적용 가능</text>
    <text x="580" y="300" font-size="11" fill="#8b98a5">정산기한 20일, 판매대금 50% 별도관리</text>

    <line x1="490" y1="279" x2="555" y2="279" stroke="#4f9dff" stroke-width="1.5" marker-end="url(#arrow)" />

    <line x1="260" y1="314" x2="260" y2="348" stroke="#8b98a5" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="272" y="336" font-size="11" fill="#8b98a5">아니오</text>

    <!-- T4 -->
    <rect x="30" y="358" width="460" height="66" rx="12" fill="#10161d" stroke="#8b98a5" stroke-dasharray="4 3" />
    <text x="50" y="384" font-size="12" font-weight="600" fill="#8b98a5">예: 프랜차이즈 본사-가맹점, 여객터미널 등</text>
    <text x="50" y="402" font-size="12" fill="#8b98a5">PG 규제 제외, 해당 업권의 개별 법령 확인 필요</text>

    <text x="30" y="450" font-size="11" font-style="italic" fill="#8b98a5">※ '부수적' 여부를 가르는 구체적 기준(매출 비중 등)은 조문에 없고, 추후 금융위 가이드라인에서 정해질 예정</text>
  </g>
</svg>
