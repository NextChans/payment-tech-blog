<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 800" role="img" aria-label="전자금융감독규정 클라우드 이용 절차 7단계 흐름도">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f9dff" />
    </marker>
  </defs>
  <rect x="0" y="0" width="500" height="800" fill="#0b0f14" />

  <!-- Step boxes -->
  <g font-family="sans-serif" font-size="16" fill="#e6edf3">
    <g>
      <rect x="30" y="20" width="440" height="70" rx="12" fill="#10161d" stroke="#1f2933" />
      <text x="250" y="45" text-anchor="middle" font-weight="600">1. 업무 선정 &amp; 중요도 평가</text>
      <text x="250" y="68" text-anchor="middle" font-size="13" fill="#8b98a5">중요업무 / 비중요업무 구분</text>
    </g>

    <line x1="250" y1="90" x2="250" y2="128" stroke="#4f9dff" stroke-width="2" marker-end="url(#arrow)" />

    <g>
      <rect x="30" y="130" width="440" height="70" rx="12" fill="#10161d" stroke="#1f2933" />
      <text x="250" y="155" text-anchor="middle" font-weight="600">2. 클라우드 회사(CSP) 안전성 평가</text>
      <text x="250" y="178" text-anchor="middle" font-size="13" fill="#8b98a5">재무 안정성·보안 역량 확인</text>
    </g>

    <line x1="250" y1="200" x2="250" y2="238" stroke="#4f9dff" stroke-width="2" marker-end="url(#arrow)" />

    <g>
      <rect x="30" y="240" width="440" height="70" rx="12" fill="#10161d" stroke="#1f2933" />
      <text x="250" y="265" text-anchor="middle" font-weight="600">3. 보안 조치(안전성 확보조치) 수립</text>
      <text x="250" y="288" text-anchor="middle" font-size="13" fill="#8b98a5">망분리, 암호화, 접근통제 등</text>
    </g>

    <line x1="250" y1="310" x2="250" y2="348" stroke="#4f9dff" stroke-width="2" marker-end="url(#arrow)" />

    <g>
      <rect x="30" y="350" width="440" height="70" rx="12" fill="#10161d" stroke="#1f2933" />
      <text x="250" y="375" text-anchor="middle" font-weight="600">4. 정보보호위원회 심의·의결</text>
      <text x="250" y="398" text-anchor="middle" font-size="13" fill="#8b98a5">회사 내부 승인 절차</text>
    </g>

    <line x1="250" y1="420" x2="250" y2="458" stroke="#4f9dff" stroke-width="2" marker-end="url(#arrow)" />

    <g>
      <rect x="30" y="460" width="440" height="70" rx="12" fill="#10161d" stroke="#1f2933" />
      <text x="250" y="485" text-anchor="middle" font-weight="600">5. 계약 체결</text>
      <text x="250" y="508" text-anchor="middle" font-size="13" fill="#8b98a5">감독규정상 필수 기재사항 포함</text>
    </g>

    <line x1="250" y1="530" x2="250" y2="568" stroke="#4f9dff" stroke-width="2" marker-end="url(#arrow)" />

    <g>
      <rect x="30" y="570" width="440" height="70" rx="12" fill="#10161d" stroke="#4f9dff" stroke-width="2" />
      <text x="250" y="595" text-anchor="middle" font-weight="600">6. 이용 개시 + 사후보고</text>
      <text x="250" y="618" text-anchor="middle" font-size="13" fill="#4f9dff">계약 후 3개월 이내 금감원 보고</text>
    </g>

    <line x1="250" y1="640" x2="250" y2="678" stroke="#4f9dff" stroke-width="2" marker-end="url(#arrow)" />

    <g>
      <rect x="30" y="680" width="440" height="70" rx="12" fill="#10161d" stroke="#1f2933" />
      <text x="250" y="705" text-anchor="middle" font-weight="600">7. 이용 종료 시 출구전략 이행</text>
      <text x="250" y="728" text-anchor="middle" font-size="13" fill="#8b98a5">데이터 이전·파기 계획대로 실행</text>
    </g>
  </g>
</svg>
