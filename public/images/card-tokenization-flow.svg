<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="카드정보 토큰화 흐름: 고객, 가맹점, PG, 토큰 볼트, 카드사 사이에서 원본 카드번호와 토큰이 어떻게 나뉘어 흐르는지 보여주는 다이어그램">
  <defs>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b98a5" />
    </marker>
    <marker id="arrowAccent2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f9dff" />
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="340" fill="#0b0f14" />

  <g font-family="sans-serif" fill="#e6edf3">
    <rect x="20" y="120" width="130" height="80" rx="12" fill="#10161d" stroke="#1f2933" />
    <text x="85" y="155" text-anchor="middle" font-size="15" font-weight="600">고객</text>
    <text x="85" y="176" text-anchor="middle" font-size="11" fill="#8b98a5">카드번호 입력</text>

    <line x1="150" y1="150" x2="188" y2="150" stroke="#8b98a5" stroke-width="2" marker-end="url(#arrowMuted)" />
    <text x="169" y="130" text-anchor="middle" font-size="10" fill="#8b98a5">최초 1회만</text>
    <text x="169" y="143" text-anchor="middle" font-size="10" fill="#8b98a5">카드번호 그대로</text>

    <rect x="190" y="120" width="130" height="80" rx="12" fill="#10161d" stroke="#1f2933" />
    <text x="255" y="155" text-anchor="middle" font-size="15" font-weight="600">가맹점</text>
    <text x="255" y="176" text-anchor="middle" font-size="11" fill="#8b98a5">보관 금지 (여전법 §19)</text>

    <line x1="320" y1="150" x2="358" y2="150" stroke="#8b98a5" stroke-width="2" marker-end="url(#arrowMuted)" />

    <rect x="360" y="120" width="130" height="80" rx="12" fill="#10161d" stroke="#4f9dff" stroke-width="2" />
    <text x="425" y="150" text-anchor="middle" font-size="15" font-weight="600">PG</text>
    <text x="425" y="171" text-anchor="middle" font-size="11" fill="#4f9dff">토큰화 지점</text>

    <line x1="425" y1="200" x2="425" y2="238" stroke="#4f9dff" stroke-width="2.5" marker-end="url(#arrowAccent2)" />
    <text x="500" y="222" text-anchor="middle" font-size="10" fill="#4f9dff">원본 저장 위임</text>

    <rect x="335" y="240" width="180" height="80" rx="12" fill="#10161d" stroke="#4f9dff" stroke-width="2" stroke-dasharray="5,3" />
    <text x="425" y="270" text-anchor="middle" font-size="14" font-weight="600">토큰 볼트</text>
    <text x="425" y="289" text-anchor="middle" font-size="10" fill="#8b98a5">빌링키 / 상용 벤더 /</text>
    <text x="425" y="303" text-anchor="middle" font-size="10" fill="#8b98a5">자체 구축 중 택1</text>

    <line x1="490" y1="150" x2="528" y2="150" stroke="#4f9dff" stroke-width="2.5" marker-end="url(#arrowAccent2)" />
    <text x="509" y="130" text-anchor="middle" font-size="10" fill="#4f9dff">이후부터는</text>
    <text x="509" y="143" text-anchor="middle" font-size="10" fill="#4f9dff">토큰만 재사용</text>

    <rect x="530" y="120" width="130" height="80" rx="12" fill="#10161d" stroke="#1f2933" />
    <text x="595" y="150" text-anchor="middle" font-size="15" font-weight="600">PG 서버</text>
    <text x="595" y="171" text-anchor="middle" font-size="11" fill="#8b98a5">토큰만 DB에 저장</text>

    <line x1="660" y1="150" x2="698" y2="150" stroke="#8b98a5" stroke-width="2" marker-end="url(#arrowMuted)" />
    <text x="679" y="130" text-anchor="middle" font-size="10" fill="#8b98a5">승인 요청 시</text>
    <text x="679" y="143" text-anchor="middle" font-size="10" fill="#8b98a5">볼트가 복원</text>

    <rect x="700" y="120" width="80" height="80" rx="12" fill="#10161d" stroke="#1f2933" />
    <text x="740" y="155" text-anchor="middle" font-size="14" font-weight="600">카드사</text>
    <text x="740" y="176" text-anchor="middle" font-size="10" fill="#8b98a5">최종 승인</text>
  </g>
</svg>
